name: 📺 CRT Stats

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch CRT image
        run: |
          mkdir -p assets
          curl -s "https://github-profile-crt.vercel.app/api/github-stats?username=Moty2111&theme=dark" -o assets/crt-stats.svg

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/crt-stats.svg
          git diff --cached --quiet || (git commit -m "📺 Update CRT stats" && git push)
