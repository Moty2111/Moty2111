name: 🔘 Generate Custom Buttons

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"   # раз в неделю

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install svgwrite
      - name: Create assets folder
        run: mkdir -p assets
      - name: Generate buttons SVG
        run: python generate_buttons.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/social-buttons.svg
          git diff --cached --quiet || (git commit -m "🔘 Update custom buttons" && git push)
