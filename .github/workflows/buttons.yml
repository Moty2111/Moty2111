name: 🔘 Social Buttons

on:
  workflow_dispatch:
  schedule:
    - cron: "49 5 * * 0" # Sunday

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install svgwrite

      - name: Generate buttons
        run: python generate_buttons.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/social-buttons.svg
          if git diff --cached --quiet; then
            echo "No changes — buttons are up to date."
            exit 0
          fi
          git commit -m "🔘 Update social buttons"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" && git push origin "${{ github.ref_name }}"; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            sleep 5
          done
          echo "Could not push after 5 attempts." >&2
          exit 1
