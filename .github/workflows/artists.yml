name: 🎧 Update Artists SVG

on:
  schedule:
    - cron: "0 0 * * 0"   # раз в неделю
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install svgwrite requests
      - name: Generate artists SVG
        run: python generate_music.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/artists.svg
          git diff --cached --quiet || (git commit -m "🎧 Update artists avatars" && git push)
