name: 🐍 Generate Snake Animation

on:
  schedule:
    # Запуск каждый день в полночь UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

# Специальные права для записи в репозиторий
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🎨 Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#8A2BE2&color_dots=#58A6FF,#3CAAFF,#2D8CFF,#1A6EFF,#0055FF&dark_bg=0D1117
            dist/snake-dark.svg?color_snake=#A855F7&color_dots=#8B5CF6,#7C3AED,#6D28D9,#5B21B6,#4C1D95&dark_bg=0D1117&dark_mode=true
            dist/snake-neon.svg?color_snake=#00FFCC&color_dots=#FF0066,#FF3366,#FF6666,#FF9999,#FFCCCC&dark_bg=0D1117
            dist/snake-gold.svg?color_snake=#FFD700&color_dots=#FF4500,#FF6347,#FF7F50,#FFA07A,#FFDAB9&dark_bg=0D1117
            dist/snake-matrix.svg?color_snake=#00FF41&color_dots=#008F11,#00A813,#00C215,#00DB17,#00F519&dark_bg=0D1117

      - name: 📁 Prepare output directory
        run: |
          mkdir -p output
          cp dist/*.svg output/

      - name: 🚀 Deploy to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: output
          force_orphan: true
          commit_message: "🐍 Update snake animations [skip ci]"
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: ✅ Verify deployment
        run: |
          echo "✨ Snake animations generated successfully!"
          echo "📁 Files created:"
          ls -la output/
