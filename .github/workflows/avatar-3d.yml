name: ✨ Animated 3D Avatar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"  # раз в месяц

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 📦 Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: 📁 Create assets folder
        run: mkdir -p assets

      - name: 🖼️ Download GitHub avatar
        run: |
          curl -sL https://github.com/Moty2111.png -o avatar.png
          echo "Avatar downloaded:"
          ls -la avatar.png

      - name: 🎞️ Generate 3D spinning animation
        run: |
          # Параметры
          FRAMES=24                # количество кадров
          DELAY=6                  # задержка между кадрами (в сотых секунды, 6 ≈ 60 мс)
          SIZE=400                 # размер аватара
          GLOW_COLOR="#58A6FF"     # цвет свечения

          # Создаём временную папку для кадров
          mkdir frames

          # Генерируем кадры: вращаем аватар по горизонтали и смещаем фон для 3D-эффекта
          for i in $(seq 0 $((FRAMES-1))); do
            ANGLE=$(echo "scale=2; 360 / $FRAMES * $i" | bc)
            # Поворачиваем аватар
            convert avatar.png \
              -resize ${SIZE}x${SIZE} \
              -background none \
              -distort SRT "0.8,${ANGLE}" \
              -gravity center \
              -extent ${SIZE}x${SIZE} \
              \( +clone -alpha extract -blur 0x10 -shade 130x30 -alpha On \) \
              -compose Overlay -composite \
              -bordercolor "$GLOW_COLOR" -border 8 \
              -alpha set -virtual-pixel transparent \
              -channel A -blur 0x16 -level 50,100% +channel \
              -resize ${SIZE}x${SIZE} \
              frames/frame_$(printf "%03d" $i).png
          done

          # Собираем кадры в анимированный GIF
          convert -dispose previous -delay $DELAY -loop 0 frames/*.png assets/3d-avatar.gif

          echo "Animated 3D avatar created:"
          ls -la assets/3d-avatar.gif

      - name: 📤 Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/3d-avatar.gif
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "✨ Update animated 3D avatar"
            git push
          fi
