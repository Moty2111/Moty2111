name: ✨ Animated 3D Avatar (Fixed)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Create assets folder
        run: mkdir -p assets

      - name: Download avatar
        run: curl -sL https://github.com/Moty2111.png -o avatar.png

      - name: Generate spinning GIF
        run: |
          convert avatar.png -resize 400x400 -background none \
            \( -clone 0 -distort SRT 0,0,0,0.9,18 \) \
            \( -clone 0 -distort SRT 0,0,0,0.9,36 \) \
            \( -clone 0 -distort SRT 0,0,0,0.9,54 \) \
            \( -clone 0 -distort SRT 0,0,0,0.9,72 \) \
            \( -clone 0 -distort SRT 0,0,0,0.9,90 \) \
            \( -clone 0 -distort SRT 0,0,0,0.9,108 \) \
            \( -clone 0 -distort SRT 0,0,0,0.9,126 \) \
            \( -clone 0 -distort SRT 0,0,0,0.9,144 \) \
            \( -clone 0 -distort SRT 0,0,0,0.9,162 \) \
            \( -clone 0 -distort SRT 0,0,0,0.9,180 \) \
            \( -clone 0 -distort SRT 0,0,0,0.9,198 \) \
            \( -clone 0 -distort SRT 0,0,0,0.9,216 \) \
            \( -clone 0 -distort SRT 0,0,0,0.9,234 \) \
            \( -clone 0 -distort SRT 0,0,0,0.9,252 \) \
            \( -clone 0 -distort SRT 0,0,0,0.9,270 \) \
            \( -clone 0 -distort SRT 0,0,0,0.9,288 \) \
            \( -clone 0 -distort SRT 0,0,0,0.9,306 \) \
            \( -clone 0 -distort SRT 0,0,0,0.9,324 \) \
            \( -clone 0 -distort SRT 0,0,0,0.9,342 \) \
            \( -clone 0 -distort SRT 0,0,0,0.9,360 \) \
            -set delay 5 -loop 0 -layers RemoveDups \
            -alpha set -virtual-pixel transparent \
            -channel A -blur 0x10 -level 50,100% +channel \
            assets/3d-avatar.gif

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/3d-avatar.gif
          git diff --cached --quiet || (git commit -m "Update animated 3D avatar" && git push)
