name: ✨ Animated 3D Avatar (Stable)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Create assets folder
        run: mkdir -p assets

      - name: Download avatar
        run: curl -sL https://github.com/Moty2111.png -o avatar.png

      - name: Generate spinning GIF
        run: |
          # Создаём 20 кадров с поворотом через SRT (x,y,scale,angle)
          for angle in $(seq 0 18 342); do
            convert avatar.png \
              -resize 400x400 \
              -background none \
              -distort SRT 0,0,1,$angle \
              -gravity center \
              -extent 400x400 \
              -bordercolor "#58A6FF" -border 6 \
              -alpha set -virtual-pixel transparent \
              -channel A -blur 0x10 -level 50,100% +channel \
              frame_$(printf "%03d" $angle).png
          done

          # Собираем кадры в GIF с задержкой 5 сотых секунды (50 мс)
          convert -dispose previous -delay 5 -loop 0 frame_*.png assets/3d-avatar.gif

          # Удаляем временные кадры
          rm frame_*.png

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/3d-avatar.gif
          git diff --cached --quiet || (git commit -m "Update animated 3D avatar" && git push)
