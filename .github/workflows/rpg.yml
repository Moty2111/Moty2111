name: 🎮 RPG Stats

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Важно: загружаем полную историю для корректного rebase
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: pip install svgwrite requests
      
      - name: Create assets folder
        run: mkdir -p assets
      
      - name: Generate RPG SVG
        run: python generate_rpg.py
      
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/rpg-stats.svg
          
          # Проверяем, есть ли изменения, чтобы не создавать пустых коммитов
          if ! git diff --cached --quiet; then
            git commit -m "🎮 Update RPG stats"
            
            # Получаем последние изменения с удаленного репозитория и интегрируем их
            git pull --rebase origin ${{ github.ref_name }}
            
            # Отправляем обновленные изменения
            git push origin ${{ github.ref_name }}
          else
            echo "Изменений нет, коммит не требуется."
          fi
