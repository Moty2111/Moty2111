name: 🏙️ Generate 3D Skyline City

on:
  schedule:
    - cron: "0 5 * * *"   # каждый день в 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skyline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p assets

      - name: Generate 3D skyline PNG
        uses: yihong0618/github-contributions-skyline@v1
        with:
          username: Moty2111
          output: assets/skyline.png
          width: 800
          height: 400
          # Цвета можно кастомизировать
          color1: "#58A6FF"    # низкая активность
          color2: "#3CAAFF"    # средняя активность
          color3: "#8A2BE2"    # высокая активность
          color4: "#FFD700"    # максимальная активность

      - name: Commit and push skyline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/skyline.png
          git diff --cached --quiet || (git commit -m "Update 3D skyline city" && git push)
