name: 💃 Neon Dancer

on:
  schedule:
    - cron: "0 0 * * *"      # ежедневно в полночь
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: pip install Pillow
      - name: Generate dancer GIF
        run: python generate_dancer.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/dancer.gif
          git diff --cached --quiet || (git commit -m "💃 Update neon dancer animation" && git push)
